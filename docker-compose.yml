

  services:
    mongo:
      image: mongo
      ports:
        - 27017:27017
      environment:
         - MONGO_INITDB_ROOT_USERNAME=admin
         - MONGO_INITDB_ROOT_PASSWORD=qwerty

    mongo-express:
      image: mongo-express
      ports:
        - 8081:8081
      environment:
        - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
        - ME_CONFIG_MONGODB_ADMINPASSWORD=qwerty
        - ME_CONFIG_MONGODB_URL=mongodb://admin:qwerty@mongo:27017/
      
    backend:
      build: ./Backend
      container_name: backend
      ports:
        - 5000:5000
      volumes:
        - ./Backend:/app
      depends_on:
        - mongo
        - mongo-express

    frontend:
      build: ./Frontend
      container_name: frontend
      ports:
        - 5173:5173
      volumes:
        - ./Frontend:/app
      depends_on:
        - backend

      